<!DOCTYPE html>

<html lang="en">
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Rover marciano</title>
    <style>
        body { margin: 0px; overflow: hidden; }

        /* Código CSS */
        #mineralCounter {
            position: fixed;
            top: 12px;
            left: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(20, 20, 20, 0.55);
            color: #fff;
            font-family: sans-serif;
            font-size: 14px;
            z-index: 10;
            user-select: none;
        }

        #batteryCounter {
            position: fixed;
            top: 50px;
            left: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(20, 20, 20, 0.55);
            color: #44ff44; /* Começa com cor verde */
            font-family: sans-serif;
            font-size: 14px;
            z-index: 10;
            user-select: none;
            transition: color 0.3s;
        }

        #btnControlos {
            position: fixed;
            top: 12px;
            right: 12px;
            padding: 8px 16px;
            background: rgba(20, 20, 20, 0.8);
            color: #66d9ff;
            border: 1px solid #66d9ff;
            border-radius: 8px;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 14px;
            z-index: 10;
            transition: all 0.3s ease;
        }

        #btnControlos:hover {
            background: rgba(102, 217, 255, 0.2);
            box-shadow: 0 0 10px rgba(102, 217, 255, 0.5);
        }

        #menuControlos {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 20, 0.95);
            color: white;
            padding: 25px 40px;
            border: 2px solid #44ff44;
            border-radius: 12px;
            font-family: sans-serif;
            z-index: 20;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .escondido {
            display: none !important;
        }

        #menuControlos h3 {
            margin-top: 0;
            color: #44ff44;
            text-align: center;
            letter-spacing: 1px;
        }

        #menuControlos ul {
            list-style-type: none;
            padding: 0;
            margin: 20px 0;
        }

        #menuControlos li {
            margin-bottom: 12px;
            font-size: 15px;
            color: #ddd;
        }

        #menuControlos li strong {
            display: inline-block;
            width: 45px;
            color: #66d9ff;
            background: #222;
            text-align: center;
            border-radius: 4px;
            padding: 2px 0;
        }

        #menuControlos hr {
            border: 0;
            border-top: 1px solid #444;
            margin: 15px 0;
        }

        #btnFechar {
            display: block;
            margin: 0 auto;
            padding: 8px 20px;
            background: #333;
            color: white;
            border: 1px solid #888;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #btnFechar:hover {
            background: #ff4444;
            border-color: #ff4444;
        }
        
    </style>

    <script type="importmap">
        {
          "imports": {
            "three": "https://threejs.org/build/three.module.js",
            "three/addons/": "https://threejs.org/examples/jsm/"
          }
        }
      </script>

    <script type="module">

        import * as THREE from "three";

        import { OrbitControls } from "three/addons/controls/OrbitControls.js";

        // Constantes globais
        const sceneElements = {
            sceneGraph: null,
            camera: null,
            povCamera: null,
            followCamera: null,
            activeCamera: null,
            control: null,
            renderer: null,
            sunLight: null,
            ambientLight: null,
            rover: null,
            headlights: [],
            headlightsOn: false,
            battery: 100,
            minerals: [],
            mineralsCollected: 0,
            cameraMode: 0,
        };

        const terrainData = {
            size: 1000,
            segments: 250, // Quantidade de elevações no terreno
            heights: [],
        };

        const mineralData = {
            count: 500,
            collectionDistance: 1.25,
        };

        const helper = {

            initEmptyScene: function (sceneElements) {

                sceneElements.sceneGraph = new THREE.Scene();

                // Câmaras

                const width = window.innerWidth;
                const height = window.innerHeight;
                const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 500);
                sceneElements.camera = camera;
                sceneElements.activeCamera = camera;
                camera.position.set(0, 15, 15);
                camera.lookAt(0, 0, 0);

                const povCamera = new THREE.PerspectiveCamera(75, width / height, 0.1, 500);
                sceneElements.povCamera = povCamera;
                povCamera.position.set(0, 1.2, 0.6);

                const followCamera = new THREE.PerspectiveCamera(60, width / height, 0.1, 500);
                sceneElements.followCamera = followCamera;

                // Iluminação

                // Luz Ambiente
                const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
                sceneElements.sceneGraph.add(ambientLight);
                sceneElements.ambientLight = ambientLight;

                // Luz Solar
                const sunLight = new THREE.DirectionalLight(0xffaa88, 3);
                sunLight.position.set(100, 100, 0);
                sceneElements.sceneGraph.add(sunLight);

                // Configurar o mapa de sombras do Sol para abranger todo o terreno
                sunLight.castShadow = true;
                const d = terrainData.size / 2; // O tamanho do mapa de sombras
                sunLight.shadow.camera.left = -d;
                sunLight.shadow.camera.right = d;
                sunLight.shadow.camera.top = d;
                sunLight.shadow.camera.bottom = -d;
                sunLight.shadow.camera.near = 0.5;
                sunLight.shadow.camera.far = 500;
                
                // Resolução da sombra
                sunLight.shadow.mapSize.width = 2048;
                sunLight.shadow.mapSize.height = 2048;

                sceneElements.sunLight = sunLight;
                sceneElements.sunOrbitSpeed = 0.00005; // Velocidade do dia e noite
                
                // Renderer
                const renderer = new THREE.WebGLRenderer({ antialias: true });
                sceneElements.renderer = renderer;
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setClearColor('rgb(255, 255, 150)', 1.0);
                renderer.setSize(width, height);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;

                const htmlElement = document.querySelector("#Tag3DScene");
                htmlElement.appendChild(renderer.domElement);

                // Controlar a câmara com o rato
                sceneElements.control = new OrbitControls(camera, renderer.domElement);
                sceneElements.control.screenSpacePanning = true;

                // Impede o utilizador de rodar a câmara totalmente para debaixo de terra
                sceneElements.control.maxPolarAngle = Math.PI / 2 - 0.05;

            },

            render: function (sceneElements) {
                sceneElements.renderer.render(sceneElements.sceneGraph, sceneElements.activeCamera);
            },
        };

        const scene = {
            // Função para obter a altura do terreno em coordenadas X e Z específicas utilizando interpolação bilinear
            getTerrainHeightAt: function (x, z) {
                const grid = terrainData.segments;
                const side = grid + 1;
                const halfSize = terrainData.size / 2;
                const step = terrainData.size / grid;

                // Limita as coordenadas X e Z para ficarem dentro do terreno
                const clampedX = THREE.MathUtils.clamp(x, -halfSize, halfSize);
                const clampedZ = THREE.MathUtils.clamp(z, -halfSize, halfSize);

                const fx = (clampedX + halfSize) / step;
                const fz = (clampedZ + halfSize) / step;

                // Identifica os quatro pontos do quadrado que envolvem as coordenadas (x, z)
                const x0 = Math.floor(fx);
                const z0 = Math.floor(fz);
                const x1 = Math.min(grid, x0 + 1);
                const z1 = Math.min(grid, z0 + 1);
 
                const tx = fx - x0;
                const tz = fz - z0;

                // Altura de cada um dos pontos do quadrado
                const h00 = terrainData.heights[z0 * side + x0] ?? 0;
                const h10 = terrainData.heights[z0 * side + x1] ?? 0;
                const h01 = terrainData.heights[z1 * side + x0] ?? 0;
                const h11 = terrainData.heights[z1 * side + x1] ?? 0;

                const h0 = h00 * (1 - tx) + h10 * tx;
                const h1 = h01 * (1 - tx) + h11 * tx;
                return h0 * (1 - tz) + h1 * tz;
            },

            load3DObjects: function (sceneGraph) {
                // Terreno
                const terrenoGeometry = new THREE.PlaneGeometry(terrainData.size, terrainData.size, terrainData.segments, terrainData.segments);
                terrenoGeometry.rotateX(-Math.PI / 2);
                for(let i = 0; i < terrenoGeometry.attributes.position.count; i++) {
                    const y = Math.random() * 2; // Altura aleatória para criar um terreno acidentado
                    terrenoGeometry.attributes.position.setY(i, y);
                    terrainData.heights[i] = y;
                }
                terrenoGeometry.computeVertexNormals();

                const terrenoMaterial = new THREE.MeshStandardMaterial({ 
                    color: 'rgb(150, 75, 0)', 
                    roughness: 1.0,
                    side: THREE.DoubleSide
                });
                const terreno = new THREE.Mesh(terrenoGeometry, terrenoMaterial);
                terreno.receiveShadow = true; // O terreno recebe sombras
                sceneGraph.add(terreno);



                // Rover
                const grupo = new THREE.Group();

                // Paleta de materiais do rover
                const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.4, roughness: 0.6 });
                const darkMetalMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.7, roughness: 0.3 });
                const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
                const solarMaterial = new THREE.MeshStandardMaterial({ color: 0x112244, metalness: 0.9, roughness: 0.2 });
                const cameraLensMaterial = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1 });
                const goldMaterial = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8, roughness: 0.3 });

                // Chassi central
                const chassiGeometry = new THREE.BoxGeometry(1.2, 0.6, 2);
                const chassi = new THREE.Mesh(chassiGeometry, bodyMaterial);
                chassi.position.y = 0.7;
                chassi.castShadow = true;
                chassi.receiveShadow = true;
                grupo.add(chassi);

                // Painel solar
                const panelGeometry = new THREE.BoxGeometry(1.0, 0.05, 1.4);
                const panel = new THREE.Mesh(panelGeometry, solarMaterial);
                panel.position.set(0, 1.025, -0.1);
                panel.castShadow = true;
                grupo.add(panel);

                // Rodas
                const wheelGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.25, 32);
                wheelGeometry.rotateZ(Math.PI / 2);

                const wheelPositions = [
                    [-0.75, 0.3, 0.8],  // Trás Esquerda
                    [ 0.75, 0.3, 0.8],  // Trás Direita
                    [-0.75, 0.3, 0],    // Meio Esquerda
                    [ 0.75, 0.3, 0],    // Meio Direita
                    [-0.75, 0.3, -0.8], // Frente Esquerda
                    [ 0.75, 0.3, -0.8]  // Frente Direita
                ];

                sceneElements.roverWheels = []; 

                wheelPositions.forEach(pos => {
                    const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                    wheel.position.set(...pos);
                    wheel.castShadow = true;
                    wheel.receiveShadow = true;
                    grupo.add(wheel);
                    sceneElements.roverWheels.push(wheel);
                });

                // Suspensão (Hastes que ligam as rodas ao chassi)
                wheelPositions.forEach(pos => {
                    const suspGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.4);
                    const susp = new THREE.Mesh(suspGeometry, darkMetalMaterial);
                    susp.position.set(pos[0] > 0 ? pos[0] - 0.1 : pos[0] + 0.1, 0.5, pos[2]);
                    susp.castShadow = true;
                    grupo.add(susp);
                });

                // Mastro que segura a câmara
                const mastGeometry = new THREE.CylinderGeometry(0.06, 0.06, 0.8);
                const mast = new THREE.Mesh(mastGeometry, bodyMaterial);
                mast.position.set(0.4, 1.4, -0.8);
                mast.castShadow = true;
                grupo.add(mast);

                // Cabeça
                const headGroup = new THREE.Group();
                headGroup.position.set(0.4, 1.8, -0.8); // Topo do mastro

                const headBox = new THREE.BoxGeometry(0.4, 0.2, 0.25);
                const headMesh = new THREE.Mesh(headBox, bodyMaterial);
                headMesh.castShadow = true;
                headGroup.add(headMesh);

                // Lentes (Olhos) da câmara
                const lensGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.05, 16);
                lensGeo.rotateX(Math.PI / 2); // Apontar para a frente
                
                const lens1 = new THREE.Mesh(lensGeo, cameraLensMaterial);
                lens1.position.set(-0.1, 0, -0.13);
                headGroup.add(lens1);
                
                const lens2 = new THREE.Mesh(lensGeo, cameraLensMaterial);
                lens2.position.set(0.1, 0, -0.13);
                headGroup.add(lens2);

                grupo.add(headGroup);

                // Gerador termoelétrico (detalhe dourado)
                const rtgGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.5, 16);
                rtgGeo.rotateZ(Math.PI / 2);
                const rtg = new THREE.Mesh(rtgGeo, goldMaterial);
                rtg.position.set(0, 0.7, 1.1);
                rtg.castShadow = true;
                grupo.add(rtg);

                // Posição inicial
                grupo.position.set(0, 0, -2);
                
                // Pousa o rover no terreno de maneira a não começar nem a flutuar nem enterrado
                grupo.position.y = scene.getTerrainHeightAt(grupo.position.x, grupo.position.z);

                // Faróis
                const createHeadlight = (xPosition) => {
                    // Intensidade 0 para começar desligado
                    const spotLight = new THREE.SpotLight(0xffffee, 0); 
                    spotLight.position.set(xPosition, 1.0, -1);
                    spotLight.angle = Math.PI / 5;
                    spotLight.penumbra = 0.5;
                    spotLight.distance = 60;
                    spotLight.castShadow = true;

                    const targetObj = new THREE.Object3D();
                    targetObj.position.set(xPosition, 0.5, -5); 
                    grupo.add(targetObj);
                    spotLight.target = targetObj;

                    grupo.add(spotLight);
                    sceneElements.headlights.push(spotLight);
                };

                createHeadlight(-0.4); // Farol Esquerdo
                createHeadlight(0.4);  // Farol Direito

                sceneGraph.add(grupo);
                sceneElements.rover = grupo;

                // Minerais
                const mineralGeometry = new THREE.IcosahedronGeometry(0.22, 0);
                const mineralMaterial = new THREE.MeshStandardMaterial({
                    color: 0x66d9ff,
                    metalness: 0.35,
                    roughness: 0.15,
                    emissive: 0x113344,
                    emissiveIntensity: 0.35,
                });

                // Gerar minerais em posições aleatórias, mas garantindo que estão acima do terreno
                for (let i = 0; i < mineralData.count; i++) {
                    const mineral = new THREE.Mesh(mineralGeometry, mineralMaterial.clone());
                    const x = THREE.MathUtils.randFloat(-terrainData.size / 2 + 2, terrainData.size / 2 - 2);
                    const z = THREE.MathUtils.randFloat(-terrainData.size / 2 + 2, terrainData.size / 2 - 2);
                    const y = scene.getTerrainHeightAt(x, z) + 0.22;

                    mineral.position.set(x, y, z);
                    mineral.castShadow = true;
                    mineral.receiveShadow = true;
                    mineral.name = `mineral_${i}`;
                    mineral.userData.collected = false;

                    sceneElements.minerals.push(mineral);
                    sceneGraph.add(mineral);
                }

            },  
        };

        var keyD = false, keyA = false, keyS = false, keyW = false;


        function computeFrame(time) {
            // Função para o ciclo dia / noite
            if (sceneElements.sunLight) {
                const angle = time * sceneElements.sunOrbitSpeed;
                const radius = 150; // Distância do sol ao centro do mapa

                // Calcular a órbita num arco (nasce, sobe, põe-se)
                sceneElements.sunLight.position.x = Math.cos(angle) * radius;
                sceneElements.sunLight.position.y = Math.sin(angle) * radius;
                sceneElements.sunLight.position.z = Math.cos(angle) * 50; 

                // Transições de intensidade baseadas na altura do sol
                // heightFactor vai de 0 (sol no horizonte/abaixo) a 1 (sol no pico do meio-dia)
                const heightFactor = Math.max(0, sceneElements.sunLight.position.y / radius);
                sceneElements.sunLight.intensity = heightFactor * 4.0;

                // A luz ambiente escurece de noite, mas nunca fica a zero para se conseguir ver alguma coisa
                if (sceneElements.ambientLight) {
                    sceneElements.ambientLight.intensity = 0.1 + (heightFactor * 0.7);
                }

                // Muda a cor do céu de acordo com a hora
                const dayColor = new THREE.Color('rgb(255, 200, 150)');
                const nightColor = new THREE.Color('rgb(5, 5, 10)');
                const currentSkyColor = nightColor.clone().lerp(dayColor, heightFactor);
                
                sceneElements.renderer.setClearColor(currentSkyColor, 1.0);
            }

            if (sceneElements.control) {
                sceneElements.control.update();
            }

            // Não permitir que a câmara livre ultrapasse o terreno
            if (sceneElements.cameraMode === 0) {
                const cam = sceneElements.camera;
                const terrainHeight = scene.getTerrainHeightAt(cam.position.x, cam.position.z);
                
                // altura mínima a que a câmara fica do terreno
                const minCamHeight = terrainHeight + 0.5;

                // Se a câmara tentar descer abaixo desse limite, empurrá-la de volta para cima
                if (cam.position.y < minCamHeight) {
                    cam.position.y = minCamHeight;
                }
            }
            
            // Lógica da bateria e faróis
            const isMoving = keyW || keyS || keyA || keyD;
            const isDaytime = sceneElements.sunLight && sceneElements.sunLight.position.y > 0;

            // Recarregar (se for dia)
            if (isDaytime) {
                // Carrega mais rápido quando o sol está mais alto
                const chargeRate = (sceneElements.sunLight.position.y / 150) * 0.05;
                sceneElements.battery += chargeRate;
            }

            // Gastar bateria
            if (isMoving && sceneElements.battery > 0) {
                sceneElements.battery -= 0.03; // Gasta a andar
            }
            if (sceneElements.headlightsOn && sceneElements.battery > 0) {
                sceneElements.battery -= 0.015; // Gasta com luzes ligadas
            }

            // Limitar entre 0 e 100
            sceneElements.battery = THREE.MathUtils.clamp(sceneElements.battery, 0, 100);

            // Desligar luzes à força se ficar sem bateria
            if (sceneElements.battery <= 0 && sceneElements.headlightsOn) {
                sceneElements.headlightsOn = false;
                sceneElements.headlights.forEach(light => light.intensity = 0);
            }

            // Atualizar o display da bateria
            const batteryUI = document.querySelector("#batteryCounter");
            batteryUI.textContent = `Bateria: ${Math.floor(sceneElements.battery)}%`;
            if (sceneElements.battery > 50) batteryUI.style.color = "#44ff44"; // Verde
            else if (sceneElements.battery > 20) batteryUI.style.color = "#ffff44"; // Amarelo
            else batteryUI.style.color = "#ff4444"; // Vermelho

            // Controlar o rover
            const carro = sceneElements.rover;
            const rotSpeed = 0.04; // Velocidade a que o rover vira
            const hasBattery = sceneElements.battery > 0;

            if (hasBattery) {

                // Movimento (Avançar e Recuar na direção para onde está virado)
                if (keyW) {
                    carro.translateZ(-0.2);
                    if (keyA) {
                        carro.translateZ(-0.2);
                        carro.rotation.y += rotSpeed; // Vira à esquerda
                    }

                    if (keyD) {
                        carro.translateZ(-0.2);
                        carro.rotation.y -= rotSpeed; // Vira à direita
                    }
                }
                if (keyS) {
                    carro.translateZ(0.2);
                    if (keyD) {
                        carro.translateZ(0.2);
                        carro.rotation.y += rotSpeed; // Vira à esquerda
                    }

                    if (keyA) {
                        carro.translateZ(0.2);
                        carro.rotation.y -= rotSpeed; // Vira à direita
                    }
                }
            }

            // Manter o rover dentro dos limites do plano
            const roverLimit = (terrainData.size / 2) - 0.8;
            carro.position.x = THREE.MathUtils.clamp(carro.position.x, -roverLimit, roverLimit);
            carro.position.z = THREE.MathUtils.clamp(carro.position.z, -roverLimit, roverLimit);


            // Inclinar o rover de acordo com o terreno (pitch and roll)
            const currentYaw = carro.rotation.y;
            
            const L_Z = 0.8;  // Distância do centro até às rodas da frente/trás
            const L_X = 0.75; // Distância do centro até às rodas laterais
            
            const dirZ = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), currentYaw);
            const dirX = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), currentYaw);

            const pFront = { x: carro.position.x + dirZ.x * L_Z, z: carro.position.z + dirZ.z * L_Z };
            const pBack  = { x: carro.position.x - dirZ.x * L_Z, z: carro.position.z - dirZ.z * L_Z };
            const pRight = { x: carro.position.x + dirX.x * L_X, z: carro.position.z + dirX.z * L_X };
            const pLeft  = { x: carro.position.x - dirX.x * L_X, z: carro.position.z - dirX.z * L_X };

            // Obter a altura do terreno nesses exatos pontos
            const hFront = scene.getTerrainHeightAt(pFront.x, pFront.z);
            const hBack  = scene.getTerrainHeightAt(pBack.x, pBack.z);
            const hRight = scene.getTerrainHeightAt(pRight.x, pRight.z);
            const hLeft  = scene.getTerrainHeightAt(pLeft.x, pLeft.z);

            // A nova altura do chassi passa a ser a média das alturas das rodas
            carro.position.y = (hFront + hBack + hRight + hLeft) / 4; 

            // Calcular a inclinação usando trigonometria
            const pitch = Math.atan2(hFront - hBack, L_Z * 2); // Levantar ou baixar a frente do rover
            const roll  = Math.atan2(hRight - hLeft, L_X * 2); // Tombar para os lados

            carro.rotation.order = 'YXZ';
            carro.rotation.x = pitch;
            carro.rotation.z = roll;

            //Fazer as rodas girar adequadamente
            if (keyW || keyS) {
                // Andar para a frente ou trás: todas as rodas giram no mesmo sentido
                const direction = keyW ? -0.2 : 0.2;
                sceneElements.roverWheels.forEach(wheel => {
                    wheel.rotation.x -= direction;
                });
            }

                // Lógica das câmaras

                // Câmara POV
                if (sceneElements.povCamera) {
                    const localCamPos = new THREE.Vector3(0.4, 1.8, -1);
                    carro.localToWorld(localCamPos); 
                    sceneElements.povCamera.position.copy(localCamPos);

                    const localTargetPos = new THREE.Vector3(0.4, 1.6, -10);
                    carro.localToWorld(localTargetPos); 
                    sceneElements.povCamera.lookAt(localTargetPos);
                }

                // Câmara seguir
                if (sceneElements.followCamera) {
                    const idealPos = new THREE.Vector3(0, 3.5, 6); 
                    carro.localToWorld(idealPos);
                    
                    // Tornar o movimento da câmara mais suave
                    sceneElements.followCamera.position.lerp(idealPos, 0.1);

                    const idealTarget = new THREE.Vector3(0, 1, 0);
                    carro.localToWorld(idealTarget);
                    
                    if (!sceneElements.currentFollowTarget) {
                        sceneElements.currentFollowTarget = idealTarget.clone();
                    }
                    
                    sceneElements.currentFollowTarget.lerp(idealTarget, 0.1);
                    sceneElements.followCamera.lookAt(sceneElements.currentFollowTarget);
                }

                // Recolha dos minerais
                for (let i = sceneElements.minerals.length - 1; i >= 0; i--) {
                    const mineral = sceneElements.minerals[i];
                    if (!mineral || mineral.userData.collected) {
                        continue;
                    }

                    mineral.rotation.x += 0.01;
                    mineral.rotation.y += 0.02;

                    // Quando apanha um mineral, marca-o como recolhido, remove-o da cena e incrementa o contador
                    if (carro.position.distanceTo(mineral.position) < mineralData.collectionDistance) {
                        mineral.userData.collected = true;
                        sceneElements.sceneGraph.remove(mineral);
                        sceneElements.minerals.splice(i, 1);
                        sceneElements.mineralsCollected += 1;
                        updateMineralCounter();
                    }
                }

            helper.render(sceneElements);

            requestAnimationFrame(computeFrame);
        }


        function init() {
            helper.initEmptyScene(sceneElements);
            scene.load3DObjects(sceneElements.sceneGraph);
            requestAnimationFrame(computeFrame);
        }


        window.addEventListener('resize', resizeWindow);

        document.addEventListener('keydown', onDocumentKeyDown, false);
        document.addEventListener('keyup', onDocumentKeyUp, false);

        function onDocumentKeyDown(event) {
            switch (event.keyCode) {
                case 68: //d
                    keyD = true;
                    break;
                case 83: //s
                    keyS = true;
                    break;
                case 65: //a
                    keyA = true;
                    break;
                case 87: //w
                    keyW = true;
                    break;
                case 80: //p
                    if (!event.repeat) {
                        toggleCamera();
                    }
                    break;
                case 76: //l
                    if (!event.repeat && sceneElements.battery > 0) {
                        sceneElements.headlightsOn = !sceneElements.headlightsOn;
                        // Intensidade 40 quando ligado, 0 quando desligado
                        const intensity = sceneElements.headlightsOn ? 40 : 0; 
                        sceneElements.headlights.forEach(light => {
                            light.intensity = intensity;
                        });
                    }
                    break;
            }
        }

        function onDocumentKeyUp(event) {
            switch (event.keyCode) {
                case 68: //d
                    keyD = false;
                    break;
                case 83: //s
                    keyS = false;
                    break;
                case 65: //a
                    keyA = false;
                    break;
                case 87: //w
                    keyW = false;
                    break;
            }
        }

        // Função para trocar a câmara
        function toggleCamera() {
            sceneElements.cameraMode = (sceneElements.cameraMode + 1) % 3;

            if (sceneElements.cameraMode === 0) {
                sceneElements.activeCamera = sceneElements.camera;
                if (sceneElements.control) {
                    sceneElements.control.enabled = true;
                }
                return;
            }

            if (sceneElements.cameraMode === 1) {
                sceneElements.activeCamera = sceneElements.povCamera;
            } else {
                sceneElements.activeCamera = sceneElements.followCamera;
            }

            if (sceneElements.control) {
                sceneElements.control.enabled = false;
            }
        }

        function updateMineralCounter() {
            const counter = document.querySelector("#mineralCounter");
            if (counter) {
                counter.textContent = `Minerais recolhidos: ${sceneElements.mineralsCollected}`;
            }
        }

        // Ajustar ao tamanho da janela
        function resizeWindow(eventParam) {
            const width = window.innerWidth;
            const height = window.innerHeight;

            sceneElements.camera.aspect = width / height;
            sceneElements.camera.updateProjectionMatrix();

            if (sceneElements.povCamera) {
                sceneElements.povCamera.aspect = width / height;
                sceneElements.povCamera.updateProjectionMatrix();
            }

            if (sceneElements.followCamera) {
                sceneElements.followCamera.aspect = width / height;
                sceneElements.followCamera.updateProjectionMatrix();
            }

            sceneElements.renderer.setSize(width, height);

            computeFrame(sceneElements);
        }

        // Menu de controlos
        const btnControlos = document.getElementById('btnControlos');
        const btnFechar = document.getElementById('btnFechar');
        const menuControlos = document.getElementById('menuControlos');

        btnControlos.addEventListener('click', () => {
            menuControlos.classList.remove('escondido');
        });

        btnFechar.addEventListener('click', () => {
            menuControlos.classList.add('escondido');
        });

        init();
 

    </script>
</head>
<body>
    <div id="mineralCounter">Minerais recolhidos: 0</div>
    <div id="batteryCounter">Bateria: 100%</div>
    <button id="btnControlos">Ver Controlos</button>
    <div id="menuControlos" class="escondido">
        <h3>Painel de Navegação</h3>
        <ul>
            <li><strong>W</strong> : Avançar</li>
            <li><strong>S</strong> : Recuar</li>
            <li><strong>A</strong> : Virar à Esquerda</li>
            <li><strong>D</strong> : Virar à Direita</li>
            <li><hr></li>
            <li><strong>P</strong> : Mudar de Câmara (Modos: Livre, POV, Seguir)</li>
            <li><strong>L</strong> : Ligar / Desligar Faróis</li>
            <li><strong>Rato</strong> : Rodar a câmara (Modo Livre)</li>
        </ul>
        <button id="btnFechar">Fechar [X]</button>
    </div>
    <div id="Tag3DScene"></div>
</body>
</html>
